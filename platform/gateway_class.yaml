# platform/gatewayclass.yaml (owned by the platform team, applied by Argo CD)
apiVersion: v1
kind: Namespace
metadata:
  name: platform-gateway
---
# The only AWS-specific object: the ALB is internal by default, this makes it public.
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: internet-facing
  namespace: platform-gateway
spec:
  scheme: internet-facing
  sourceRanges:
    - 165.225.249.22/32
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eks-auto-alb
spec:
  controllerName: eks.amazonaws.com/gateway-alb
  parametersRef: # ALB, managed by Auto Mode
    # every Gateway of this class is public
    group: gateway.k8s.aws
    kind: LoadBalancerConfiguration
    name: internet-facing
    namespace: platform-gateway