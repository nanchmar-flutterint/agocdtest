# Lab Part 8: the two functions a Composition uses.
# A function is a small Pod that Crossplane calls while building resources.

# How function Pods should look (they need no AWS access, so no special service account)
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: functions
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            team: platform        # required by Kyverno policy require-team-label
        spec:
          containers:
            - name: package-runtime
              resources:
                requests:         # required by Kyverno policy require-requests
                  cpu: 50m
                  memory: 128Mi
---
# Copies and transforms values between your object and the AWS resources
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.2
  runtimeConfigRef:
    name: functions
---
# Loads an EnvironmentConfig (here: the network IDs) into the Composition
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-environment-configs
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs:v0.9.2
  runtimeConfigRef:
    name: functions
