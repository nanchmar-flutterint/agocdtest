image:
  tag: 6.2.2-apache
database:
  name: wordpress
  size: small      # small or medium; creates a WordPressDatabase (RDS). Empty = none
  storage:
    size: 2Gi
  existingSecret: wordpress-rds-password   # created by Crossplane (infra/team-blog/database.yaml)

mysql:
  enabled: false   # the database is RDS now, see externalDatabase

externalDatabase:
  host: wordpress-db.cvykyvaeq4mn.eu-central-1.rds.amazonaws.com

gateway:
  enabled: true