image:
  tag: 6.2.2-apache
database:
  name: wordpress
  size: small      # small or medium; creates a WordPressDatabase (RDS). Empty = none
  storage:
    size: 2Gi
  existingSecret: wordpress-db-password   # created by Crossplane for the WordPressDatabase

mysql:
  enabled: false   # the database is RDS now, see externalDatabase

externalDatabase:
  host: team-blog-wordpress.cvykyvaeq4mn.eu-central-1.rds.amazonaws.com   # <namespace>-<release>

gateway:
  enabled: true