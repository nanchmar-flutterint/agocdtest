apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.4.*
    helm:
      valuesObject:
        # Required by the require-team-label Kyverno policy
        customLabels:
          team: platform
  destination:
    server: arn:aws:eks:eu-central-1:120747724657:cluster/wp-lab
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=truebas