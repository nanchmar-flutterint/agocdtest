apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.10.0
    helm:
      parameters:
        - name: config.preserve
          value: 'false'
  destination:
    server: arn:aws:eks:eu-central-1:120747724657:cluster/wp-lab
    namespace: kyerno
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
