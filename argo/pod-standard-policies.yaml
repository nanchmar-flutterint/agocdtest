apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pod-standard-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno-policies
    targetRevision: 3.10.0
  destination:
    server: arn:aws:eks:eu-central-1:120747724657:cluster/wp-lab
    namespace: kyerno
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
